apply plugin: 'java'

group 'pt.lsts'
version '5.5.7-unify'

ext
{
   imcDir = project.hasProperty('imcDir') ? project.getProperty('imcDir') : rootProject.file("../imc").absolutePath
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

dependencies {
    implementation group: 'com.eclipsesource.minimal-json', name: 'minimal-json', version: '0.9.5'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.2'
    implementation group: 'com.google.code.gson', name:'gson', version: '2.5'
    implementation group: 'com.fifesoft', name: 'rsyntaxtextarea', version: '2.5.8'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/generated/java', 'src/sender/java', 'src/test/java']
        }

        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources', 'src/sender/resources', 'src/test/resources']
        }
    }
}

//******************************************************************************
//* Generator.                                                                 *
//******************************************************************************

task generate(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    main = "pt.lsts.imc.generator.ClassGenerator"
    args rootProject.ext.imcDir, rootProject.file('src/generated').absolutePath
}

task protocol(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    main = "pt.lsts.imc.net.IMCProtocol"    
}

task sender(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    main = "pt.lsts.imc.sender.MessageSender"
}


task replay(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    main = "pt.lsts.util.ImcReplay"
    args = ["replay"]
}

task toJson(type: JavaExec) {
    classpath sourceSets.main.runtimeClasspath
    main = "pt.lsts.util.ImcReplay"
    args = ["toJson"]    
}



//******************************************************************************
//* Publishing.                                                                *
//******************************************************************************

apply plugin: 'maven-publish'

// Configure javadoc to be lenient with errors
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            pom {
                name = 'IMC Java'
                description = 'Java bindings for Inter-Module Communication (IMC) protocol'
                url = 'https://github.com/oceanscan/imcjava'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'oceanscan'
                        name = 'OceanScan'
                        organization = 'OceanScan'
                        organizationUrl = 'https://github.com/oceanscan'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/oceanscan/imcjava.git'
                    developerConnection = 'scm:git:ssh://github.com/oceanscan/imcjava.git'
                    url = 'https://github.com/oceanscan/imcjava'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/oceanscan/imcjava")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            }
        }
        
        // Keep local publishing option for testing
        maven {
            name = "Local"
            url = "file://" + System.getProperty("user.home") + "/maven"
        }
    }
}

task printVersion {
   doLast { 
       logger.lifecycle(project.version)
   }
}
